name: Fill links
on:
  workflow_dispatch:
    inputs:
      allow_search:
        description: "Płatne wyszukiwanie w sieci (tylko po zgodzie właściciela): wpisz 1"
        type: string
        default: ""
      limit:
        type: string
        default: "160"
      only:
        type: string
        default: ""
      dry:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium >/dev/null && python bot/fill_links.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOW_SEARCH: ${{ github.event.inputs.allow_search }}
          LIMIT: ${{ github.event.inputs.limit }}
          ONLY: ${{ github.event.inputs.only }}
          DRY: ${{ github.event.inputs.dry }}
