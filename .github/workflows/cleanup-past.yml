name: Czyszczenie starych wydarzeń (co miesiąc)
# Usuwa wydarzenia zakończone ponad 30 dni temu (decyzja właściciela 27.11.2026). Najpierw zaszyfrowana kopia bazy.
on:
  schedule:
    - cron: "17 0 1 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Kopia zapasowa przed czyszczeniem
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python bot/backup.py backup.json
          gzip -9 backup.json
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SUPABASE_SECRET_KEY" --symmetric --cipher-algo AES256 -o backup.json.gz.gpg backup.json.gz
          rm backup.json.gz
      - uses: actions/upload-artifact@v4
        with:
          name: outtoday-backup-before-cleanup-${{ github.run_number }}
          path: backup.json.gz.gpg
          retention-days: 90
      - name: Usunięcie wydarzeń zakończonych ponad 30 dni temu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python bot/cleanup_past.py
