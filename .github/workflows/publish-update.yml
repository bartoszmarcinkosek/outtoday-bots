name: Publish app update (OTA)

# Wysyła poprawkę kodu apki bez nowej instalacji:
# - kanał "preview": zainstalowane APK testowe,
# - kanał "production": wersja ze sklepu (Google Play / TestFlight),
# - kanał "expo-go": iPhone w Expo Go (stały link).
on:
  workflow_dispatch:
    inputs:
      message:
        description: "Co się zmieniło (krótko)"
        type: string
        default: "Poprawki"
      production:
        description: "Wyślij też do wersji ze sklepu"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Preview (APK testowe)
        env:
          MSG: ${{ inputs.message }}
        run: eas update --channel preview --environment preview --message "$MSG" --non-interactive
      - name: Expo Go (iPhone)
        env:
          MSG: ${{ inputs.message }}
          FOR_EXPO_GO: "1"
        run: eas update --channel expo-go --environment preview --platform ios --message "$MSG" --non-interactive
      - name: Production (sklep)
        if: ${{ inputs.production }}
        env:
          MSG: ${{ inputs.message }}
        run: eas update --channel production --environment production --message "$MSG" --non-interactive
