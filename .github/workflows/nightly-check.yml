name: Nightly check (free, no AI)
on:
  schedule:
    - cron: "17 23 * * *"   # 3:17 w nocy czasu UAE
  workflow_dispatch:
    inputs:
      dry:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python bot/nightly_check.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY: ${{ github.event.inputs.dry }}
      - name: Free link fix (no AI)
        if: ${{ github.event.inputs.dry == '' }}
        continue-on-error: true
        timeout-minutes: 25
        run: python -m playwright install --with-deps chromium >/dev/null && python bot/fill_links.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: "unused"
          FREE: "1"
      - name: Bramka jakości – lista nowych pozycji do sprawdzenia (QA after bots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-${{ github.job }}-${{ strategy.job-index }}
          path: qa_gate.jsonl
          if-no-files-found: ignore
          retention-days: 3
