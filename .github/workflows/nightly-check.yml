name: Nightly check (free, no AI)
on:
  schedule:
    - cron: "17 23 * * *"   # 3:17 w nocy czasu UAE
  workflow_dispatch:
    inputs:
      dry:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python bot/nightly_check.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY: ${{ github.event.inputs.dry }}
