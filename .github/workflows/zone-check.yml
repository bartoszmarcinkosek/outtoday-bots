name: Zone check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  z:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y tsx app/scripts/zone-check.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
