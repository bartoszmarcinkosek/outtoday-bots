name: App Store – wpisz dane strony (bez wysyłki do przeglądu)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    env:
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: "6837590273"
    steps:
      - uses: actions/checkout@v4
      - name: Klucz
        env:
          P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s\n' "$P8" > "$EXPO_ASC_API_KEY_PATH" && chmod 600 "$EXPO_ASC_API_KEY_PATH"
      - run: pip install -q pyjwt cryptography requests
      - run: python3 .github/scripts/asc_metadata.py
      - if: always()
        run: rm -f "$EXPO_ASC_API_KEY_PATH"
