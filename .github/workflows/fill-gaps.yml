name: Fill time and price
on:
  workflow_dispatch:
    inputs:
      dry:
        type: string
        default: ""
permissions:
  contents: read
jobs:
  f:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium >/dev/null && python bot/fill_gaps.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY: ${{ github.event.inputs.dry }}
      - name: Bramka jakości – lista nowych pozycji do sprawdzenia (QA after bots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-${{ github.job }}-${{ strategy.job-index }}
          path: qa_gate.jsonl
          if-no-files-found: ignore
          retention-days: 3
