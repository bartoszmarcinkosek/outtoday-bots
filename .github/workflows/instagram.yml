name: Instagram (official accounts -> pending events)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Próba: nic nie zapisuje"
        type: boolean
        default: false
      limit:
        description: "Ile kont przejrzeć"
        type: string
        default: "100"
      redo:
        description: "Przeczytaj ponownie posty z 30 dni (oferty)"
        type: boolean
        default: false
      only:
        description: "Tylko te konta (po przecinku)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalacja
        run: pip install -r requirements.txt
      - name: Instagram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_LIMIT: ${{ inputs.limit || '100' }}
          IN_REDO: ${{ inputs.redo }}
          IN_ONLY: ${{ inputs.only }}
        run: |
          ARGS=(--limit "$IN_LIMIT")
          if [ "$IN_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$IN_REDO" = "true" ]; then ARGS+=(--redo); fi
          if [ -n "$IN_ONLY" ]; then ARGS+=(--only "$IN_ONLY"); fi
          python bot/instagram.py "${ARGS[@]}"
