name: iOS build (EAS) + TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "po zbudowaniu wyślij do TestFlight (true/false)"
        type: string
        default: "true"

permissions:
  contents: read

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    env:
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: 8X4QX6F7L8
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Klucz App Store Connect (tylko w pamięci runnera)
        env:
          P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s\n' "$P8" > "$EXPO_ASC_API_KEY_PATH"
          chmod 600 "$EXPO_ASC_API_KEY_PATH"
          test -n "$EXPO_ASC_KEY_ID" && test -n "$EXPO_ASC_ISSUER_ID" && grep -q "BEGIN PRIVATE KEY" "$EXPO_ASC_API_KEY_PATH" && echo "klucz OK"
      - name: Numer aplikacji w App Store Connect
        id: asc
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, time, jwt, requests
          key = open(os.environ["EXPO_ASC_API_KEY_PATH"]).read()
          tok = jwt.encode({"iss": os.environ["EXPO_ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 900,
                            "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["EXPO_ASC_KEY_ID"]})
          r = requests.get("https://api.appstoreconnect.apple.com/v1/apps", params={"filter[bundleId]": "ae.outtoday.app"},
                           headers={"Authorization": f"Bearer {tok}"}, timeout=30)
          r.raise_for_status()
          d = r.json()["data"]
          import sys
          print("apps found:", len(d), file=sys.stderr)
          print(f"app_id={d[0]['id'] if d else ''}")
          PY
          echo "ASC app id: $(grep app_id $GITHUB_OUTPUT | tail -1)"
      - run: npm ci
      - name: Build iOS (podpisywanie przez klucz API)
        run: eas build --platform ios --profile production --non-interactive --wait
      - name: Wyślij do TestFlight
        if: ${{ inputs.submit == 'true' }}
        env:
          ASC_APP_ID: ${{ steps.asc.outputs.app_id }}
        run: |
          node -e '
            const fs=require("fs"); const j=JSON.parse(fs.readFileSync("eas.json"));
            j.submit.production.ios={ascAppId:process.env.ASC_APP_ID, appleTeamId:"8X4QX6F7L8",
              ascApiKeyPath:process.env.EXPO_ASC_API_KEY_PATH, ascApiKeyIssuerId:process.env.EXPO_ASC_ISSUER_ID, ascApiKeyId:process.env.EXPO_ASC_KEY_ID};
            fs.writeFileSync("eas.json", JSON.stringify(j,null,2));'
          eas submit --platform ios --profile production --latest --non-interactive --wait
      - name: Usuń klucz
        if: always()
        run: rm -f "$EXPO_ASC_API_KEY_PATH"
