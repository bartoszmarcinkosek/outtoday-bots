name: Hints (Cobone/Groupon -> official pages)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Próba: nic nie zapisuje"
        type: boolean
        default: true
      limit:
        description: "Ile nowych podpowiedzi sprawdzić na stronach oficjalnych"
        type: string
        default: "80"

permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalacja
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Podpowiedzi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_LIMIT: ${{ inputs.limit || '80' }}
        run: |
          ARGS=(--limit "$IN_LIMIT")
          if [ "$IN_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          python bot/hints.py "${ARGS[@]}"
      - name: Bramka jakości – lista nowych pozycji do sprawdzenia (QA after bots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-${{ github.job }}-${{ strategy.job-index }}
          path: qa_gate.jsonl
          if-no-files-found: ignore
          retention-days: 3
