name: Newsletters (Gmail -> deals)

on:
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:
    inputs:
      days:
        description: "Ile dni wstecz"
        type: string
        default: "14"
      dry_run:
        description: "Próba: nic nie zapisuje"
        type: boolean
        default: true

concurrency:
  group: newsletters
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install anthropic requests beautifulsoup4
      - name: Newslettery
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          IN_DAYS: ${{ inputs.days || '4' }}
          IN_DRY: ${{ inputs.dry_run || 'false' }}
        run: |
          A=(--days "$IN_DAYS"); if [ "$IN_DRY" = "true" ]; then A+=(--dry-run); fi
          python bot/newsletters.py "${A[@]}"
