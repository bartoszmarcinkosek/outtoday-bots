name: Events bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Próba: nic nie zapisuje w bazie, tylko raport"
        type: boolean
        default: true
      only:
        description: "Tylko te źródła (id po przecinku, puste = wszystkie)"
        type: string
        default: ""
      max_items:
        description: "Limit wpisów"
        type: number
        default: 400
      force:
        description: "Sprawdź strony nawet bez zmian"
        type: boolean
        default: false
  # Harmonogram: zadanie zaplanowane w Claude (codziennie 6:13 UAE) uruchamia ten workflow.

permissions:
  contents: read

concurrency:
  group: events-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part:
          - { name: dubai, cities: "Dubai" }
          - { name: abu-dhabi, cities: "Abu Dhabi" }
          - { name: north, cities: "Al Ain,Sharjah,Ras Al Khaimah,Ajman,Fujairah,Umm Al Quwain" }
    name: run (${{ matrix.part.name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Bot
        if: ${{ inputs.only != 'eventbrite' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_FORCE: ${{ inputs.force }}
          IN_ONLY: ${{ inputs.only }}
          IN_MAX: ${{ inputs.max_items || 400 }}
          IN_CITIES: ${{ matrix.part.cities }}
        run: |
          ARGS=(--max-items "$IN_MAX")
          if [ -z "$IN_ONLY" ]; then ARGS+=(--cities "$IN_CITIES"); elif [ "${{ matrix.part.name }}" != "dubai" ]; then exit 0; fi
          if [ "$IN_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$IN_FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ -n "$IN_ONLY" ]; then ARGS+=(--only "$IN_ONLY"); fi
          python bot/run.py "${ARGS[@]}"

      - name: Eventbrite (oficjalne API)
        if: ${{ matrix.part.name == 'north' && !inputs.dry_run && (inputs.only == '' || contains(inputs.only, 'eventbrite')) }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: python bot/eventbrite.py

      - name: Ticketmaster (API, bez AI)
        if: ${{ matrix.part.name == 'north' && !inputs.dry_run && inputs.only == '' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: python bot/ticketmaster.py

      - name: Raport do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport-${{ matrix.part.name }}
          path: out/
          if-no-files-found: ignore
      - name: Bramka jakości – lista nowych pozycji do sprawdzenia (QA after bots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-gate-${{ github.job }}-${{ strategy.job-index }}
          path: qa_gate.jsonl
          if-no-files-found: ignore
          retention-days: 3
