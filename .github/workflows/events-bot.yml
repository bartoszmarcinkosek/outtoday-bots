name: Events bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Próba: nic nie zapisuje w bazie, tylko raport"
        type: boolean
        default: true
      only:
        description: "Tylko te źródła (id po przecinku, puste = wszystkie)"
        type: string
        default: ""
      max_items:
        description: "Limit wpisów"
        type: number
        default: 50
      force:
        description: "Sprawdź strony nawet bez zmian"
        type: boolean
        default: false
  # Codziennie o 06:17 czasu UAE (przed e-mailem o 07:47). Z harmonogramu bot zawsze zapisuje do bazy jako pending.
  # Harmonogram: zadanie zaplanowane w Claude (codziennie 6:13 UAE) uruchamia ten workflow.

permissions:
  contents: read

concurrency:
  group: events-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalacja
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_FORCE: ${{ inputs.force }}
          IN_ONLY: ${{ inputs.only }}
          IN_MAX: ${{ inputs.max_items || 400 }}
        run: |
          ARGS=(--max-items "$IN_MAX")
          if [ "$IN_DRY" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$IN_FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ -n "$IN_ONLY" ]; then ARGS+=(--only "$IN_ONLY"); fi
          python bot/run.py "${ARGS[@]}"

      - name: Raport do pobrania
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raport
          path: out/
          if-no-files-found: ignore
