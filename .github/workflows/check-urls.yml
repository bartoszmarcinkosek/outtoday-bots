name: Check URLs
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Plik z kandydatami"
        type: string
        default: "candidates/places.json"
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - env:
          IN_FILE: ${{ inputs.file }}
        run: python bot/check_urls.py "$IN_FILE"
